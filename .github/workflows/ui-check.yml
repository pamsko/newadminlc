name: UI visual regression checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - admin.css
      - .github/workflows/ui-check.yml

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Start local site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/newadmin-ui-server.log 2>&1 &
          sleep 3
      - name: Verify actual computed layout and collect screenshots
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const issues=[];
            fs.mkdirSync('ui-captures',{recursive:true});
            for(const width of [1440,768,390]){
              const page=await browser.newPage({viewport:{width,height:900},deviceScaleFactor:1});
              const jsErrors=[];
              page.on('pageerror',e=>jsErrors.push(String(e)));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.screenshot({path:'ui-captures/login-'+width+'.png',fullPage:true});
              const login=await page.$eval('#demoLogin',el=>({display:getComputedStyle(el).display,columns:getComputedStyle(el).gridTemplateColumns}));
              console.log('LOGIN',width,JSON.stringify(login));
              if(width===1440){
                const cssInfo=await page.evaluate(()=>[...document.styleSheets].map((sheet,i)=>{
                  let rules=[];try{rules=[...sheet.cssRules]}catch(e){return {i,error:String(e)}}
                  const text=sheet.ownerNode?.textContent||'';
                  return {i,ruleCount:rules.length,textLength:text.length,last:rules.slice(-5).map(r=>r.cssText.slice(0,130)),targets:['.pay-config-tabs','.commerce-insights','.visual-funnel'].map(sel=>({sel,matches:rules.filter(r=>r.selectorText?.includes(sel)).length}))}
                }));
                console.log('CSSOM',JSON.stringify(cssInfo));
              }
              if(login.display!=='grid')issues.push('Login not grid at '+width);
              await page.evaluate(()=>{
                document.body.classList.add('demo-authenticated');
                const shell=document.getElementById('appShell');
                shell.style.removeProperty('display');shell.removeAttribute('aria-hidden');
                document.getElementById('demoLogin').style.display='none';
              });
              const specs=[
                ['area-de-trabalho','dashboard',['#dashboardView .commerce-insights-grid','#dashboardView .insight-list','#dashboardView .visual-funnel','#dashboardView .visual-funnel-step']],
                ['minhas-solucoes/totvs-pay/overview','totvs-pay',['#moduleView .pay-config-tabs','#moduleView .pay-config-summary','#moduleView .pay-config-steps']]
              ];
              for(const [route,label,selectors] of specs){
                await page.evaluate(route=>{location.hash='#/'+route;window.dispatchEvent(new Event('hashchange'))},route);
                await page.waitForTimeout(300);
                const styles=await page.evaluate(selectors=>selectors.map(sel=>{
                  const el=document.querySelector(sel);
                  if(!el)return {sel,missing:true};
                  const st=getComputedStyle(el);
                  return {sel,display:st.display,columns:st.gridTemplateColumns,gap:st.gap,background:st.backgroundColor,border:st.borderTopStyle};
                }),selectors);
                console.log('LAYOUT',width,route,JSON.stringify(styles));
                if(label==='totvs-pay'){
                  const config=await page.evaluate(()=>({
                    steps:[...document.querySelectorAll('#moduleView .pay-config-tabs [data-pay-tab]')].map(x=>x.textContent.trim()),
                    hasAccount:document.querySelector('#moduleView .payment-general')!==null,
                    accountFields:[...document.querySelectorAll('#moduleView [data-pay-setting]')].map(e=>e.dataset.paySetting)
                  }));
                  console.log('PAYMENT_STEPS',width,JSON.stringify(config));
                  if(config.steps.length!==5||config.steps.some(v=>/Homologa|Logs/.test(v)))issues.push('Payment steps incorrect at '+width);
                  if(!config.hasAccount||!config.accountFields.includes('restrictionMode'))issues.push('Payment general information missing at '+width);
                  await page.evaluate(()=>{location.hash='#/minhas-solucoes/totvs-pay/methods';window.dispatchEvent(new Event('hashchange'))});
                  await page.waitForTimeout(200);
                  const methods=await page.evaluate(()=>({
                    sections:[...document.querySelectorAll('#moduleView .solution-detail h3')].map(e=>e.textContent.trim()),
                    inputs:[...document.querySelectorAll('#moduleView [data-pay-setting],#moduleView [data-pay-flag]')].map(e=>e.dataset.paySetting||e.dataset.payFlag),
                    steps:document.querySelectorAll('#moduleView .pay-config-tabs [data-pay-tab]').length
                  }));
                  console.log('PAYMENT_METHODS',width,JSON.stringify(methods));
                  if(!['credit','pix','boleto','apple','google','paypal','installments','pixExpiry','boletoDueDays'].every(k=>methods.inputs.includes(k)))issues.push('Missing unified methods '+width);
                  await page.screenshot({path:'ui-captures/payment-methods-'+width+'.png',fullPage:true});
                  await page.evaluate(()=>{location.hash='#/minhas-solucoes/totvs-pay/overview';window.dispatchEvent(new Event('hashchange'))});
                  await page.waitForTimeout(150);
                }
                for(const item of styles){
                  if(item.missing){issues.push('Missing '+item.sel+' at '+route);continue}
                  if(item.sel.includes('tabs')&&item.display!=='flex')issues.push('Unstyled payment tabs at '+width);
                  if(item.sel.includes('summary')&&item.display!=='grid')issues.push('Unstyled payment summary at '+width);
                  if(item.sel.includes('insight-list')&&item.display!=='grid')issues.push('Unstyled insight list at '+width);
                  if(item.sel.includes('commerce-insights-grid')&&item.display!=='grid')issues.push('Unstyled insights at '+width);
                  if(item.sel.includes('visual-funnel')&&item.display!=='flex'&&item.display!=='grid')issues.push('Unstyled funnel at '+width+': '+item.display);
                }
                await page.screenshot({path:'ui-captures/'+label+'-'+width+'.png',fullPage:true});
              }
              // Shared registration component must use the same horizontal stepper.
              await page.evaluate(()=>{location.hash='#/categorias';window.dispatchEvent(new Event('hashchange'))});
              await page.waitForTimeout(250);
              const createButton=page.locator('[data-register-create="Categorias"]').first();
              if(await createButton.count()){
                await createButton.click();
                await page.waitForTimeout(150);
                const stepper=page.locator('.expanded-register-tabs.admin-stepper');
                if(await stepper.count()){
                  const layout=await stepper.evaluate(el=>({direction:getComputedStyle(el).flexDirection,display:getComputedStyle(el).display,steps:el.querySelectorAll('[data-editor-tab]').length}));
                  console.log('REGISTER_STEPPER',width,JSON.stringify(layout));
                  if(layout.display!=='flex'||layout.direction!=='row'||layout.steps<2)issues.push('Registration stepper not horizontal at '+width);
                  await page.screenshot({path:'ui-captures/register-'+width+'.png',fullPage:true});
                  await page.locator('#registerNext').click();
                  const blocked=await page.locator('#demoRegisterError').textContent();
                  if(!blocked?.trim())issues.push('Required field validation not triggered at '+width);
                  await page.locator('#register-code').fill('TEST-STEPPER-'+width);
                  await page.locator('#register-name').fill('Teste de cadastro');
                  await page.locator('#register-status').selectOption({label:'Ativa'});
                  await page.locator('#registerNext').click();
                  const activeStep=await page.locator('.expanded-register-tabs .active').evaluate(el=>el.dataset.editorTab);
                  if(activeStep!=='1')issues.push('Stepper navigation failed at '+width+': '+activeStep);
                  await page.locator('[data-close-register]').first().click();
                }else issues.push('Registration stepper missing at '+width);
              }else issues.push('Category registration action missing at '+width);
              if(jsErrors.length)issues.push('JS errors '+width+': '+jsErrors.join(' | ').slice(0,500));
              await page.close();
            }
            await browser.close();
            console.log('ISSUES',JSON.stringify(issues));
            if(issues.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-captures
          path: ui-captures/
          retention-days: 7
